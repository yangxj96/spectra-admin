# ==================== 项目自定义配置 ====================
spectra:
  security:
    secret:
      master-key: ${SPECTRA_SECURITY_SECRET_MASTER_KEY:}
  system:
    cors:
      required: true
      origin-patterns: https://localhost:5173,https://127.0.0.1:5173
  kaptcha:
    verify: false
  file:
    upload:
      local:
        storage-root: ${spectra.system.base-dir}/uploads
        staging-root: ${spectra.system.base-dir}/temp
      s3:
        endpoint: ${S3_ENDPOINT}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
        bucket: ${S3_BUCKET}
        region: ${S3_REGION}
      default-storage: s3

# ==================== 服务器配置 ====================
server:
  port: 4004
  forward-headers-strategy: framework
  ssl:
    key-store: ${spectra.system.base-dir}/ssl/keystore.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: ${SSL_TYPE}
    key-alias: ${SSL_ALIAS}
  servlet:
    context-path: /api
    session:
      cookie:
        name: JSESSIONID
        path: /
        same-site: none
        secure: true
        http-only: true

# ==================== Spring 配置 ====================
spring:
  quartz:
    job-store-type: jdbc
    auto-startup: false
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: false
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.instanceName: spectraQuartzScheduler
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: spectra_quartz.QRTZ_
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.threadCount: 10
      org.quartz.threadPool.threadPriority: 5
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB
      max-request-size: 1GB
  threads:
    virtual:
      enabled: true
  application:
    name: spectra-admin
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      data-source-properties:
        currentSchema: public
        reWriteBatchedInserts: true
        binaryTransfer: true
        tcpKeepAlive: true
        connectTimeout: 10
        socketTimeout: 60
        ApplicationName: ${spring.application.name}
        loginTimeout: 10
        sslmode: disable
        prepareThreshold: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  data:
    redis:
      url: redis://${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
      timeout: 10s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-idle: 10
          min-idle: 2
          max-active: 20
          max-wait: 5000ms
        shutdown-timeout: 100ms
  security:
    user:
      name:
      password:
  cache:
    type: redis

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.devops00.**.entity
  type-handlers-package: com.devops00.spectra.framework.persistence.mybatis
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-not-delete-value: "null"
      logic-delete-value: "now()"

# ==================== XSS 防范 ====================
mica:
  xss:
    enabled: true
    path-patterns: /**
    path-exclude-patterns:

# ==================== Flowable 工作流 ====================
flowable:
  database-schema: spectra_workflow
  database-schema-update: true
  jpa-enabled: false
  process-definition-location-prefix: classpath*:/processes/
  async-executor-activate: true
  history-level: full
  eventregistry:
    enabled: false
  idm:
    enabled: false
  app:
    enabled: false
  dmn:
    enabled: false
  cmmn:
    enabled: false

# ==================== 日志配置 ====================
logging:
  group:
    spectra: >-
      com.devops00.spectra
    other:
      - com.ulisesbocchio.jasyptspringboot.configuration
      - io.agentscope.harness.agent.middleware
  level:
    root: info
    other: error
    spectra: debug

# ==================== 健康检查 ====================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      status:
        order: down,out-of-service,degraded,unknown,up
