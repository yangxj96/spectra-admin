# Prettier configuration
plugins:
    - "@prettier/plugin-oxc"
overrides:
    - files:
          - "**/*.{js,mjs,cjs,jsx}"
      options:
          plugins:
              - "@prettier/plugin-oxc"
          parser: oxc
    - files:
          - "**/*.{ts,mts,cts,tsx}"
      options:
          plugins:
              - "@prettier/plugin-oxc"
          parser: oxc-ts
semi: true
tabWidth: 4
useTabs: false
singleQuote: false
quoteProps: as-needed
printWidth: 120
trailingComma: none
htmlWhitespaceSensitivity: ignore
bracketSpacing: true
bracketSameLine: true
arrowParens: avoid
endOfLine: lf
vueIndentScriptAndStyle: false
