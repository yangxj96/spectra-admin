name: Build Minimal Docker Image to GHCR

on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ---------------------------
      # Checkout
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # Setup Java 25
      # ---------------------------
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ---------------------------
      # Maven 打包
      # ---------------------------
      - name: Build Maven Project (skip tests)
        run: |
          mvn -B clean install -DskipTests
        shell: bash
        working-directory: ./spectra-admin

      # ---------------------------
      # 4. Extract Maven project version
      # ---------------------------
      - name: Get Maven Version
        id: maven_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        working-directory: ./spectra-admin

      # ---------------------------
      # 登录 GHCR
      # ---------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------
      # Build & Push Minimal Docker Image
      # ---------------------------
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./spectra-admin/spectra-launch
          file: ./spectra-admin/spectra-launch/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spectra-admin:minimal
            ghcr.io/${{ github.repository_owner }}/spectra-admin:${{ env.VERSION }}
          build-args: |
            JAR_FILE=spectra-launch-${{ env.VERSION }}.jar