name: 构建最小化Docker镜像并推送到GHCR

on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ---------------------------
      # 检出代码
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # 设置Java 25
      # ---------------------------
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ---------------------------
      # Maven 打包
      # ---------------------------
      - name: Build Maven Project
        run: mvn -B clean package -DskipTests
        shell: bash

      # ---------------------------
      # 提取Maven项目版本
      # ---------------------------
      - name: Get Maven Version
        id: maven_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ---------------------------
      # 登录 GHCR
      # ---------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------
      # 构建并推送最小化的Docker镜像
      # ---------------------------
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./spectra-launch
          file: ./spectra-launch/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spectra-admin:latest
            ghcr.io/${{ github.repository_owner }}/spectra-admin:${{ env.VERSION }}
          build-args: |
            JAR_FILE=spectra-launch-${{ env.VERSION }}.jar