name: Security Flyway PostgreSQL gate

on:
  pull_request:
    paths:
      - 'spectra-config/src/main/resources/db/migration/**'
      - 'spectra-modules/spectra-core/src/test/java/com/devops00/spectra/core/security/schema/SecurityFlywayPostgresIntegrationTest.java'
      - 'spectra-modules/spectra-core/src/test/java/com/devops00/spectra/core/security/schema/SecuritySchemaContractTest.java'
      - 'pom.xml'
      - 'mvnw'
      - '.github/workflows/security-flyway-postgres.yml'
  push:
    branches:
      - master
    paths:
      - 'spectra-config/src/main/resources/db/migration/**'
      - 'spectra-modules/spectra-core/src/test/java/com/devops00/spectra/core/security/schema/SecurityFlywayPostgresIntegrationTest.java'
      - 'spectra-modules/spectra-core/src/test/java/com/devops00/spectra/core/security/schema/SecuritySchemaContractTest.java'
      - 'pom.xml'
      - 'mvnw'
      - '.github/workflows/security-flyway-postgres.yml'

jobs:
  flyway-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: spectra-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Create disposable test databases
        env:
          PGPASSWORD: spectra-ci
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --command="CREATE DATABASE spectra_security_flyway_empty"
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --command="CREATE DATABASE spectra_security_flyway_nonempty"

      - name: Run isolated Flyway and schema gate
        env:
          SPECTRA_SECURITY_FLYWAY_POSTGRES_TEST: 'true'
          SPECTRA_SECURITY_FLYWAY_DB_URL: jdbc:postgresql://127.0.0.1:5432/spectra_security_flyway_empty
          SPECTRA_SECURITY_FLYWAY_DB_USERNAME: postgres
          SPECTRA_SECURITY_FLYWAY_DB_PASSWORD: spectra-ci
          SPECTRA_SECURITY_FLYWAY_NONEMPTY_DB_URL: jdbc:postgresql://127.0.0.1:5432/spectra_security_flyway_nonempty
          SPECTRA_SECURITY_FLYWAY_NONEMPTY_DB_USERNAME: postgres
          SPECTRA_SECURITY_FLYWAY_NONEMPTY_DB_PASSWORD: spectra-ci
        run: ./mvnw -B -pl spectra-modules/spectra-core -am test -Dtest=SecurityFlywayPostgresIntegrationTest,SecuritySchemaContractTest -Dsurefire.failIfNoSpecifiedTests=false
