spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 这部分为URL?后面的参数. 会自动拼接上去
      data-source-properties:
        # 当前SCHEMA
        currentSchema: public
        # 控制Java String参数在SQL中的绑定类型 unspecified=让 PostgreSQL 自行推断类型
        stringtype: unspecified
        # 启用 批量 INSERT 重写优化
        reWriteBatchedInserts: true
        # 允许 JDBC Driver 使用 二进制协议 传输数据
        binaryTransfer: true
        # 开启TCP层KeepAlive探测
        tcpKeepAlive: true
        # 数据库建立TCP连接的超时时间（秒）
        connectTimeout: 10
        # 数据库读操作的Socket超时（秒）
        socketTimeout: 60
        # 应用名称
        ApplicationName: ${spring.application.name}
        # JDBC层面的登录超时（秒）
        loginTimeout: 10
        # 明确SSL行为，避免 Driver 自动探测浪费时间
        sslmode: disable
        # 控制Server-side Prepared Statement启用阈值
        prepareThreshold: 5