# 自己项目的配置
spectra:
  # 系统配置
  system:
    # 基础文件夹位置,后续日志;文件上传保存等位置都要以这个位置为基础
    base-dir: files
  # 用户相关(admin123)
  user:
    default-password: ${DEFAULT_PASSWORD}
  # 文件相关
  file:
    # 文件上传配置
    upload:
      # 上传文件的位置
      upload-dir: ${spectra.system.base-dir}/uploads
      # 上传文件的位置(临时存储位置)
      upload-temp-dir: ${spectra.system.base-dir}/temp
  # 验证码相关
  kaptcha:
    type: math
    verify: false
# 服务器配置
server:
  port: 8888
  ssl:
    key-store: ${spectra.system.base-dir}/ssl/keystore.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: ${SSL_TYPE}
    key-alias: ${SSL_ALIAS}
  servlet:
    context-path: /api
    session:
      cookie:
        name: JSESSIONID
        path: /
        same-site: none
        secure: true
        http-only: true
# spring 配置
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  application:
    name: spectra-framework-launch
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
  data:
    redis:
      url: redis://QuVsKppcWvwwX2Vv@127.0.0.1:6379/0
      timeout: 10s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-idle: 10
          min-idle: 2
          max-active: 20
          max-wait: 5000ms
        shutdown-timeout: 100ms
  # 关闭他自带的用户
  security:
    user:
      name:
      password:
# mybatis plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.yangxj96.spectra.**.entity.dto
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      # 开发过程中,不使用逻辑删除
      # logic-delete-field: deleted
      # logic-not-delete-value: "null"
      # logic-delete-value: "now()"
      schema: SPECTRA
# 日志配置
logging:
  group:
    spectra: >-
      io.github.yangxj96.spectra.core
    other: >-
      com.ulisesbocchio.jasyptspringboot.configuration,
      io.github.yangxj96.spectra.core.configure.mvc.filter,
      io.github.yangxj96.spectra.core.configure.mvc.advice,
      io.github.yangxj96.spectra.core.configure,
      io.github.yangxj96.spectra.core.listener.ulog
    mp: >-
      io.github.yangxj96.spectra.core.mapper.system.OperationLogMapper
  level:
    root: info
    other: error
    spectra: debug
    mp: error
  charset:
    console: utf-8
    file: UTF-8
# 健康检查
management:
  endpoints:
    web:
      exposure:
        # 暴露所有
        include: "*"
  endpoint:
    health:
      # 显示详情状态,开发环境可以用always,生产用never
      show-details: never
# 工作流配置
flowable:
  # 数据库确定
  database-schema: domain_workflow
  database-schema-update: true
  jpa-enabled: false
  # 流程定义
  process-definition-location-prefix: classpath*:/processes/
  async-executor-activate: true
  history-level: full
  # 下面是所有可选模块,都用不到
  # 事件注册模块
  eventregistry:
    enabled: false
  # 身份管理引擎
  idm:
    enabled: false
  # Flowable 的“应用元模型”
  app:
    enabled: false
  # 决策模型引擎
  dmn:
    enabled: false
  # 案例管理引擎
  cmmn:
    enabled: false
# XSS防范
mica:
  xss:
    # 是否开启
    enabled: true
    # 拦截的
    path-patterns: /**
    # 放行的
    path-exclude-patterns:
