# 导入公共模块
spring:
  config:
    import: "classpath:/application-common.yml"
# 服务器配置
server:
  port: ${SERVER_PORT:80}
  ssl:
    key-store: ${spectra.system.base-dir}/ssl/keystore.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: ${SSL_TYPE}
    key-alias: ${SSL_ALIAS}
  servlet:
    context-path: /api
    session:
      cookie:
        name: JSESSIONID
        path: /
        same-site: none
        secure: true
        http-only: true

