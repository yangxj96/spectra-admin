# 自己项目的配置
spectra:
  # 用户相关(admin123)
  user:
    default-password: ${DEFAULT_PASSWORD}
  # 系统配置
  system:
    # 基础文件夹位置,后续日志;文件上传保存等位置都要以这个位置为基础
    base-dir: files
    # 许可证配置,如果启用了许可证模块才会有效
    license:
      license-path: ${spectra.system.base-dir}/license.lic
      public-key: classpath:key/publicKey.pem
      private-key: classpath:key/privateKey.pem
      password: ${LICENSE_PASSWORD}
    # CORS配置
    cors:
      mapping: "/**"
      origin-patterns: "*"
      methods: "*"
      headers: "*"
      credentials: true
      max-age: 3600
  # 文件相关
  file:
    # 文件上传配置
    upload:
      # 上传文件的位置
      upload-dir: ${spectra.system.base-dir}/uploads
      # 文件允许的类型
      allowed-types:
        - jpeg
        - png
        - pdf
      # 文件验证的策略
      strategies:
        - io.github.yangxj96.spectra.framework.features.fileupload.strategy.impl.TikaValidationStrategy
        - io.github.yangxj96.spectra.framework.features.fileupload.strategy.impl.MimeValidationStrategy
        - io.github.yangxj96.spectra.framework.features.fileupload.strategy.impl.ExtensionValidationStrategy
        - io.github.yangxj96.spectra.framework.features.fileupload.strategy.impl.MagicNumberValidationStrategy
  # 验证码相关
  kaptcha:
    type: chat
    verify: false
    duration: 1m
# 服务器配置
server:
  port: 8888
  ssl:
    # key-store: classpath:ssl/keystore.p12
    key-store: ${spectra.system.base-dir}/ssl/keystore.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: ${SSL_TYPE}
    key-alias: ${SSL_ALIAS}
  servlet:
    context-path: /api
    session:
      cookie:
        name: JSESSIONID
        path: /
        same-site: none
        secure: true
        http-only: true
# spring 配置
spring:
  config:
    # .env文件内是K=V的键值对符合properties的解析方式,
    # [.properties]是告诉他用properties的方式进行解析
    # [.yaml]是告诉他用.yaml的方式进行计息
    import: classpath:.env[.properties]
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  application:
    name: spectra-framework-launch
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: redis://QuVsKppcWvwwX2Vv@127.0.0.1:6379/0
      timeout: 10s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-idle: 10
          min-idle: 2
          max-active: 20
          max-wait: 5000ms
        shutdown-timeout: 100ms
# mybatis plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.yangxj96.spectra.**.entity.dto
  configuration:
    # log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      # 开发过程中,不使用逻辑删除
      # logic-delete-field: deleted
      # logic-not-delete-value: "null"
      # logic-delete-value: "now()"
      schema: SPECTRA
# 日志配置
logging:
  group:
    spectra: >-
      io.github.yangxj96.spectra.core
    other: >-
      com.ulisesbocchio.jasyptspringboot.configuration,
      io.github.yangxj96.spectra.framework,
      io.github.yangxj96.spectra.core.system.configure.ULogListener
  level:
    root: info
    other: error
    spectra: debug
  charset:
    console: utf-8
    file: UTF-8
# Sa-Token 配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  active-timeout: 3000
  is-concurrent: false
  is-share: false
  token-style: uuid
  is-log: true
  is-print: false
  cookie:
    path: /
    secure: true
    same-site: None
    http-only: true
# 健康检查
management:
  #  health:
  #    # windows下安装的redis非官方版本,存在一定问题,所以关闭检查
  #    redis:
  #      enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

