server {
    listen 443 ssl http2;
    server_name spectra.devops00.com;

    # ===== SSL =====
    ssl_certificate     /etc/letsencrypt/live/devops00.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devops00.com-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ===== 安全 =====
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$ ) {
        return 444;
    }

    location ~* ^/(wp-admin|wp-login|xmlrpc\.php) {
        return 444;
    }

    # ===== 限流 =====
    limit_conn conn_limit 20;
    limit_req zone=req_limit burst=20 nodelay;

    # ===== 前端 =====
    root /usr/share/nginx/html/spectra;
    index index.html;

    # gzip（Vite gzip_static）
    gzip on;
    gzip_static on;
    gzip_min_length 10240;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # 静态资源（禁止 SPA fallback）
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # ===== API =====
    location /api/ {
        proxy_pass http://127.0.0.1:8888;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ===== SPA fallback =====
    location / {
        try_files $uri $uri/ /index.html;
    }
}