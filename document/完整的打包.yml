name: Build & Push Spring Boot Image to GHCR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image 标签"
        required: false
        default: "0.0.1-SNAPSHOT"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pack CLI
        run: |
          curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.35.1/pack-v0.35.1-linux.tgz" \
            | sudo tar -xz -C /usr/local/bin

      - name: Build & install Maven modules
        working-directory: spectra-admin
        run: mvn -B -DskipTests install

      - name: Build & Push Spring Boot Image
        working-directory: spectra-admin
        run: |
          pack build ghcr.io/${{ github.repository }}:${{ inputs.image_tag }} \
            --path . \
            --builder paketobuildpacks/builder-noble-java-tiny:latest \
            --publish \
            --env BPL_JVM_HEAP_PERCENT=45 \
            --env BPL_JVM_METASPACE=128M \
            --env MAVEN_OPTS="-Drevision=${{ inputs.image_tag }}" \
            --env BP_JVM_VERSION=25 \
            --env BP_MAVEN_BUILT_MODULE=spectra-launch \
            --tag ghcr.io/${{ github.repository }}:latest \
            --env BP_MAVEN_BUILT_ARTIFACT=target/spectra-launch-${{ inputs.image_tag }}.jar
