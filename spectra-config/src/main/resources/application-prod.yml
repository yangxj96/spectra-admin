# ==================== 项目自定义配置 ====================
spectra:
  system:
    base-dir: files
  user:
    default-password: ${DEFAULT_PASSWORD}
  kaptcha:
    type: math
    verify: true
  file:
    upload:
      local:
        upload-dir: ${spectra.system.base-dir}/uploads
        upload-temp-dir: ${spectra.system.base-dir}/temp
      s3:
        endpoint: ${S3_ENDPOINT}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
        bucket: ${S3_BUCKET}
        region: ${S3_REGION}
      default-storage: s3
  ai:
    rag:
      api-key: ${RAG_KEY}
      base-url: ${RAG_BASE_URL}
      model-name: ${RAG_MODEL}
      embedding-batch-size: 20
      max-segment-size: 300
      max-overlap-size: 30
  notification:
    enabled: ${NOTIFICATION_ENABLED:true}
    address-encryption-key: ${NOTIFICATION_ADDRESS_ENCRYPTION_KEY:}
    sensitive-payload-key: ${NOTIFICATION_SENSITIVE_PAYLOAD_KEY:}
    worker:
      fixed-delay-ms: ${NOTIFICATION_WORKER_FIXED_DELAY_MS:5000}
      processing-timeout-seconds: ${NOTIFICATION_WORKER_PROCESSING_TIMEOUT_SECONDS:300}
      retry-base-delay-seconds: ${NOTIFICATION_WORKER_RETRY_BASE_DELAY_SECONDS:5}

# ==================== 服务器配置 ====================
server:
  port: ${SERVER_PORT:80}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  servlet:
    context-path: /api
    session:
      cookie:
        name: JSESSIONID
        path: /
        same-site: none
        secure: true
        http-only: true

# ==================== Spring 配置 ====================
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  web:
    error:
      whitelabel:
        enabled: false
      include-stacktrace: never
      include-message: never
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  threads:
    virtual:
      enabled: true
  application:
    name: spectra-admin
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-test-query: SELECT 1
      data-source-properties:
        currentSchema: public
        reWriteBatchedInserts: true
        binaryTransfer: true
        tcpKeepAlive: true
        connectTimeout: 10
        socketTimeout: 60
        ApplicationName: ${spring.application.name}
        loginTimeout: 10
        sslmode: disable
        prepareThreshold: 5
  data:
    redis:
      url: redis://${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
      timeout: 10s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-idle: 10
          min-idle: 2
          max-active: 20
          max-wait: 5000ms
        shutdown-timeout: 100ms
  security:
    user:
      name:
      password:
  cache:
    type: redis

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.devops00.**.entity
  type-handlers-package: com.devops00.spectra.common.mybatis.handler
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-not-delete-value: "null"
      logic-delete-value: "now()"

# ==================== XSS 防范 ====================
mica:
  xss:
    enabled: true
    path-patterns: /**
    path-exclude-patterns:

# ==================== Flowable 工作流 ====================
flowable:
  database-schema: spectra_workflow
  database-schema-update: false
  jpa-enabled: false
  process-definition-location-prefix: classpath*:/processes/
  async-executor-activate: true
  history-level: full
  eventregistry:
    enabled: false
  idm:
    enabled: false
  app:
    enabled: false
  dmn:
    enabled: false
  cmmn:
    enabled: false

# ==================== LangChain4j / AI ====================
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL}
      api-key: ${AI_KEY}
      model-name: ${AI_MODEL}
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: ${AI_BASE_URL}
      api-key: ${AI_KEY}
      model-name: ${AI_MODEL}
      log-requests: false
      log-responses: false

# ==================== 日志配置 ====================
logging:
  group:
    spectra: >-
      com.devops00.spectra
    other:
      - com.ulisesbocchio.jasyptspringboot.configuration
      - io.agentscope.harness.agent.middleware
  level:
    root: info
    other: error
    spectra: debug

# ==================== 健康检查 ====================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
