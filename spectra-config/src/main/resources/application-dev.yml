# ==================== 项目自定义配置 ====================
spectra:
  security:
    verification-code-hmac-key: ${SECURITY_VERIFICATION_CODE_HMAC_KEY:}
    verification-code-max-attempts: ${SECURITY_VERIFICATION_CODE_MAX_ATTEMPTS:5}
    authorization-change-token-hmac-key: ${SPECTRA_SECURITY_AUTHORIZATION_CHANGE_TOKEN_HMAC_KEY:}
    # 默认开发服务使用 HTTPS，因此刷新 Cookie 默认启用 Secure 并使用 __Host- Cookie。
    refresh-cookie-name: ${SPECTRA_SECURITY_REFRESH_COOKIE_NAME:__Host-spectra-refresh}
    refresh-cookie-secure: ${SPECTRA_SECURITY_REFRESH_COOKIE_SECURE:true}
    allow-insecure-refresh-cookie: ${SPECTRA_SECURITY_ALLOW_INSECURE_REFRESH_COOKIE:false}
    refresh-cookie-same-site: ${SPECTRA_SECURITY_REFRESH_COOKIE_SAME_SITE:Strict}
    refresh-cookie-same-site-none-allowed: ${SPECTRA_SECURITY_REFRESH_COOKIE_SAME_SITE_NONE_ALLOWED:false}
    refresh-cookie-path: ${SPECTRA_SECURITY_REFRESH_COOKIE_PATH:/}
    refresh-cookie-domain: ${SPECTRA_SECURITY_REFRESH_COOKIE_DOMAIN:}
    csrf-cookie-name: ${SPECTRA_SECURITY_CSRF_COOKIE_NAME:XSRF-TOKEN}
    csrf-header-name: ${SPECTRA_SECURITY_CSRF_HEADER_NAME:X-XSRF-TOKEN}
    mfa-encryption-key: ${SPECTRA_SECURITY_MFA_ENCRYPTION_KEY:}
    mfa-encryption-key-version: ${SPECTRA_SECURITY_MFA_ENCRYPTION_KEY_VERSION:v1}
    mfa-previous-encryption-key: ${SPECTRA_SECURITY_MFA_PREVIOUS_ENCRYPTION_KEY:}
    mfa-previous-encryption-key-version: ${SPECTRA_SECURITY_MFA_PREVIOUS_ENCRYPTION_KEY_VERSION:}
    mfa-challenge-expire: ${SPECTRA_SECURITY_MFA_CHALLENGE_EXPIRE:300}
    mfa-challenge-max-attempts: ${SPECTRA_SECURITY_MFA_CHALLENGE_MAX_ATTEMPTS:5}
    redis:
      namespace: "sec:"
      fail-closed: true
      worker-batch-size: ${SPECTRA_SECURITY_REDIS_WORKER_BATCH_SIZE:100}
    audit-archive-backend: ${SPECTRA_SECURITY_AUDIT_ARCHIVE_BACKEND:PENDING}
  system:
    base-dir: files
    cors:
      required: ${SPECTRA_CORS_REQUIRED:false}
      origin-patterns: ${SPECTRA_CORS_ORIGIN_ALLOWLIST:https://localhost:5173,https://127.0.0.1:5173,https://localhost:5174,https://127.0.0.1:5174}
  kaptcha:
    type: math
    verify: false
  file:
    upload:
      local:
        storage-root: ${spectra.system.base-dir}/uploads
        staging-root: ${spectra.system.base-dir}/temp
      s3:
        endpoint: ${S3_ENDPOINT}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
        bucket: ${S3_BUCKET}
        archive-bucket: ${S3_SECURITY_AUDIT_ARCHIVE_BUCKET:}
        archive-prefix: ${S3_SECURITY_AUDIT_ARCHIVE_PREFIX:security-audit/}
        region: ${S3_REGION}
      default-storage: s3
      chunk-size: 8388608
      min-chunk-size: 5242880
      max-chunk-size: 67108864
      max-parts: 10000
      parallelism: 3
      task-ttl: 24h
      idle-timeout: 2h
      record-retention: 7d
      orphan-retention: 7d
      presign-ttl: 15m
  notification:
    enabled: true
    address-encryption-key:
    sensitive-payload-key:
    allowed-link-prefixes: /login,/security/authentication/,/oa/,/workflow/,/notification/,/notification-center/,/system/,/file/
    worker:
      fixed-delay-ms: 5000
      processing-timeout-seconds: 300
      retry-base-delay-seconds: 5
    cleanup:
      enabled: true
      fixed-delay-ms: 3600000
      batch-size: 100
      retention-seconds: 86400

# ==================== 服务器配置 ====================
server:
  port: ${SERVER_PORT:4004}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  ssl:
    key-store: ${spectra.system.base-dir}/ssl/keystore.p12
    key-store-password: ${SSL_PASSWORD}
    key-store-type: ${SSL_TYPE}
    key-alias: ${SSL_ALIAS}
  servlet:
    context-path: /api
    session:
      cookie:
        name: JSESSIONID
        path: /
        same-site: none
        secure: true
        http-only: true

# ==================== Spring 配置 ====================
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB
      max-request-size: 1GB
  threads:
    virtual:
      enabled: true
  application:
    name: spectra-admin
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      data-source-properties:
        currentSchema: public
        reWriteBatchedInserts: true
        binaryTransfer: true
        tcpKeepAlive: true
        connectTimeout: 10
        socketTimeout: 60
        ApplicationName: ${spring.application.name}
        loginTimeout: 10
        sslmode: disable
        prepareThreshold: 5
  flyway:
    enabled: ${SPECTRA_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  data:
    redis:
      url: redis://${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
      timeout: ${SPECTRA_REDIS_COMMAND_TIMEOUT:10s}
      connect-timeout: ${SPECTRA_REDIS_CONNECT_TIMEOUT:5s}
      lettuce:
        pool:
          enabled: true
          max-idle: ${SPECTRA_REDIS_POOL_MAX_IDLE:10}
          min-idle: ${SPECTRA_REDIS_POOL_MIN_IDLE:2}
          max-active: ${SPECTRA_REDIS_POOL_MAX_ACTIVE:20}
          max-wait: ${SPECTRA_REDIS_POOL_MAX_WAIT:5000ms}
        shutdown-timeout: 100ms
  security:
    user:
      name:
      password:
  cache:
    type: redis

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.devops00.**.entity
  type-handlers-package: com.devops00.spectra.common.mybatis.handler
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-not-delete-value: "null"
      logic-delete-value: "now()"

# ==================== XSS 防范 ====================
mica:
  xss:
    enabled: true
    path-patterns: /**
    path-exclude-patterns:

# ==================== Flowable 工作流 ====================
flowable:
  database-schema: spectra_workflow
  database-schema-update: true
  jpa-enabled: false
  process-definition-location-prefix: classpath*:/processes/
  async-executor-activate: true
  history-level: full
  eventregistry:
    enabled: false
  idm:
    enabled: false
  app:
    enabled: false
  dmn:
    enabled: false
  cmmn:
    enabled: false

# ==================== 日志配置 ====================
logging:
  group:
    spectra: >-
      com.devops00.spectra
    other:
      - com.ulisesbocchio.jasyptspringboot.configuration
      - io.agentscope.harness.agent.middleware
  level:
    root: info
    other: error
    spectra: debug

# ==================== 健康检查 ====================
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      status:
        order: down,out-of-service,degraded,unknown,up
