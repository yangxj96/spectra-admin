[package]
name = "spectra-tools"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "spectra_tools"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spectra-tools-cli"
path = "src/main.rs"

[dependencies]
jni = "0.18"
md5 = "0.7"
hex = "0.4"
wmi = "0.7"
serde = { version = "1.0.228", features = ["derive"] }